  name: ahlachat
  description: A new Flutter project.

  publish_to: 'none'

  version: 1.0.1+1

  environment:
    sdk: ">=3.2.0 <4.0.0"

  dependencies:
    flutter:
      sdk: flutter

    flutter_localizations:
      sdk: flutter

    # UI
    cupertino_icons: ^1.0.8
    google_fonts: ^6.3.2
    floating_draggable_widget: ^2.1.4
    carousel_slider: ^5.1.1
    font_awesome_flutter: ^11.0.0
    flutter_smart_dialog: ^4.9.8+9
    adaptive_action_sheet: ^2.0.2
    tab_indicator_styler: ^2.0.0
    flutter_image_slideshow: ^0.1.6
    vertical_tabs_flutter: ^1.0.0
    pusher_channels_flutter: any
    # State management / utilities
    get: ^4.7.2
    provider: ^6.1.5+1
    flutter_bloc: ^9.1.1
    equatable: ^2.0.7
    get_it: ^8.2.0
    dartz: ^0.10.1
    shared_preferences: ^2.5.3
    dio: ^5.9.0
    cached_network_image: ^3.4.1

    # Firebase
    firebase_core: ^4.1.1
    firebase_auth: ^6.1.0
    firebase_messaging: ^16.0.2
    firebase_app_check: ^0.4.1+1

    # Authentication / social
    google_sign_in: ^6.3.0
    flutter_facebook_auth: ^7.1.2

    # Audio / video
    # The app uses the pre-6.x Agora API (RtcEngine.create and ClientRole).
    agora_rtc_engine:
      path: third_party/agora_rtc_engine
    just_audio: ^0.10.5

    # Notifications / permissions
    flutter_local_notifications: ^19.4.2
    permission_handler: ^12.0.1
    wakelock_plus: ^1.2.11

    # Features used by the existing application code
    fluttertoast: ^8.2.14
    image_cropper: ^8.1.0
    image_picker: ^1.2.3
    svgaplayer_flutter:
      path: third_party/svgaplayer_flutter
    spring: ^2.0.2
    flutter_native_splash: ^2.4.4
    country_calling_code_picker: ^2.0.1
    # 3.4.1+ removed the `flutter_sim_country_code` dependency, which used the
    # removed PluginRegistry.Registrar API and broke the Android build.
    country_code_picker: ^3.4.1
    country_picker: ^2.0.27
    share:
      path: third_party/share
    photo_view: ^0.15.0
    pin_code_fields: ^8.0.1
    simple_timer:
      path: third_party/simple_timer

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^5.0.0

  # Vendored patched copy of flutter_sim_country_code 0.1.2.
  #
  # The published version is pulled in transitively by country_calling_code_picker
  # and is broken on modern Flutter:
  #   - it used the removed v1-embedding API PluginRegistry.Registrar
  #   - its pubspec capped the SDK below Dart 3, making it unsolvable
  #   - its Gradle build referenced jcenter(), which is shut down
  # No newer release exists, so the fix is carried in third_party/.
  dependency_overrides:
    flutter_sim_country_code:
      path: third_party/flutter_sim_country_code

  flutter:
    # The project had no top-level `flutter:` section at all, so Material icons
    # were never bundled. Packages such as country_calling_code_picker and
    # adaptive_action_sheet declare uses-material-design, and the build warned:
    #   Expected to find fonts for (MaterialIcons, ...) but found (...)
    uses-material-design: true

    # Tajawal is applied as the app-wide default family in lib/main.dart.
    fonts:
      - family: Tajawal
        fonts:
          - asset: assets/fonts/Tajawal-ExtraLight.ttf
            weight: 200
          - asset: assets/fonts/Tajawal-Light.ttf
            weight: 300
          - asset: assets/fonts/Tajawal-Regular.ttf
            weight: 400
          - asset: assets/fonts/Tajawal-Medium.ttf
            weight: 500
          - asset: assets/fonts/Tajawal-Bold.ttf
            weight: 700
          - asset: assets/fonts/Tajawal-ExtraBold.ttf
            weight: 800
          - asset: assets/fonts/Tajawal-Black.ttf
            weight: 900

