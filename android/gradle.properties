# Heap sized for this machine (8 GB RAM). A larger heap pushes the Windows
# pagefile and eats disk space, which previously caused "There is not enough
# space on the disk" failures part-way through the build.
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768M
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false